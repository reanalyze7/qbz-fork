<?xml version="1.0" encoding="utf-8"?>
<!--
  QBZ Hi-Res mark.

  Replaces the Japan Audio Society "Hi-Res AUDIO" certification logo that
  used to sit here: a gold gradient square crossed by an arc. Two reasons to
  drop it. Visually it was the only saturated-gold element in a neutral UI,
  and it carried a gradient plus an arc that muddied at 24px. Legally, the
  JAS mark certifies hardware and content that passed their programme, so
  redrawing our own mark is the honest option — it is no longer a claim of
  certification, just a quality tier indicator.

  Monochrome and stroke-only on purpose, so QbzIcon's `colorize` can tint it
  like the cd/mp3 marks and it stays legible on light, dark and high-contrast
  themes. A fixed colour is what made the previous mark theme-hostile.

  The motif is a level meter rising left to right: more bits, more steps.
  Geometric, so it survives being drawn at 19px in the compact AudioStamp.
  Frame corner radius is 2.4 = 5% of the 48px box.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <rect x="2.5" y="2.5" width="43" height="43" rx="2.4" ry="2.4"
        fill="none" stroke="#000000" stroke-width="3.4"/>
  <g fill="#000000">
    <rect x="10.5" y="28.5" width="4.6" height="9"   rx="1.1"/>
    <rect x="18.1" y="23.2" width="4.6" height="14.3" rx="1.1"/>
    <rect x="25.7" y="17.9" width="4.6" height="19.6" rx="1.1"/>
    <rect x="33.3" y="10.5" width="4.6" height="27"   rx="1.1"/>
  </g>
</svg>

name: Platform triage

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - name: Parse platform from issue body
        id: platform
        uses: actions/github-script@v9
        with:
          script: |
            const body = context.payload.issue.body || '';
            // GitHub issue forms render dropdowns as "### Label\n\nValue"
            const platformMatch = body.match(/### Platform\s*\n\n(.+)/);
            const platform = platformMatch ? platformMatch[1].trim() : '';
            core.setOutput('value', platform);

      # Label only. Upstream auto-assigned macOS issues to @afonsojramos, who
      # maintains the macOS port THERE — this fork publishes no macOS build and
      # has no business pinging them on its own issues.
      - name: Label macOS issues
        if: steps.platform.outputs.value == 'macOS'
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              labels: ['platform:macos']
            });

      - name: Label Linux issues
        if: steps.platform.outputs.value == 'Linux'
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              labels: ['platform:linux']
            });

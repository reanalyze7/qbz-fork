name: Build Debug (linux)

# Fast iteration build: DEBUG profile so anyone can grab a binary without a
# local build, without waiting on the full release build's multi-hour compile.
#
# NOT opt-level 0 any more: crates/Cargo.toml's [profile.dev] puts our crates
# at opt-level 1 and every dependency at 3, because an opt-level-0 Slint/wgpu
# build renders the UI at ~3 FPS, which made this artifact useless for the
# one thing it exists for (actually trying the app). It costs build time —
# hence the raised timeout below — not runner memory: the qbz_ui peak
# documented below is frontend work that opt-level does not touch.
#
# IMPORTANT correction (found via a live rustc /proc/<pid>/cmdline dump,
# 2026-08-21): debug does NOT skip the ~20-30 GB qbz_ui memory wall
# documented in build-slint.yml. That peak comes from
# rustc's FRONTEND parsing/type-checking the ~1.6M-line Slint-generated
# module — LLVM optimization (what opt-level/debug-vs-release actually
# changes) is backend work that happens AFTER that, so it's irrelevant to
# this specific peak. Several runs of this workflow died (whole runner, not
# just the build step) chasing a red herring: cargo's "Compiling
# qbz-offline-cache" stdout line was just the last one printed before
# pipelining silently moved on to the REAL heavy unit, qbz_ui — with no
# swap (removed during that investigation on the mistaken belief memory was
# ruled out), the 15 GB RAM + 3 GB stock swap runner doesn't hold the peak.
# Same swap recipe as the other two workflows fixes it.

on:
  workflow_dispatch:

concurrency:
  group: build-debug-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v7

      - name: Add swap (qbz_ui's ~20-30 GB frontend peak)
        run: |
          ( sudo fallocate -l 18G /swap_extra \
            && sudo chmod 600 /swap_extra \
            && sudo mkswap /swap_extra \
            && sudo swapon /swap_extra ) || echo "extra swap skipped (non-fatal)"
          free -h

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake clang libclang-dev mold nasm \
            libasound2-dev libjack-jackd2-dev \
            libfontconfig1-dev libfreetype-dev \
            libxkbcommon-dev libwayland-dev libxcb1-dev \
            libgl1-mesa-dev libegl1-mesa-dev \
            libdbus-1-dev libssl-dev \
            libharfbuzz-dev libjbig2dec0-dev libopenjp2-7-dev \
            libjpeg-dev zlib1g-dev libgumbo-dev

      - name: Rust toolchain (pinned, matches the release/build-slint jobs)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-06-23

      - name: Cargo cache (Swatinem/rust-cache)
        # Separate shared-key from slint-linux (that one's target/release tree
        # would otherwise get diluted by this job's target/debug artifacts,
        # and vice versa — different profiles, different fingerprints).
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates -> target
          shared-key: slint-linux-debug
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/int' }}

      - name: Build qbz (debug, fast)
        env:
          CARGO_BUILD_JOBS: '1'
          RUSTFLAGS: '-C link-arg=-fuse-ld=mold -C debuginfo=0'
        run: |
          cargo build --manifest-path crates/Cargo.toml -p qbz
          ls -lh crates/target/debug/qbz

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: qbz-linux-x86_64-debug
          path: crates/target/debug/qbz
          if-no-files-found: error

name: Build Debug (linux)

# Fast iteration build: DEBUG profile (opt-level 0, no LLVM optimization
# passes), same intent as scripts/slint-dev-fast.sh but run on CI so anyone
# can grab a binary without a local build. Skips the release build's ~30 GB
# qbz_ui memory wall and multi-hour compile entirely — debug compiles in
# minutes since it never runs LLVM's optimizer. NOT for perf testing (see
# release-linux.yml / build-slint.yml for that); this is purely "does it run,
# does it look right".

on:
  workflow_dispatch:

concurrency:
  group: build-debug-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: Disk space check
        # REMOVED the 8 GB /swap_extra file this workflow used to add here:
        # run #4 proved memory isn't the constraint (13/15 GB free, 0 swap
        # used at cutoff), so that swap file was pure unforced downside —
        # and disk is the new suspect for why the runner keeps dying
        # WHOLESALE (every later if:always() step skipped, not just the
        # build step failing) right as qbz-offline-cache starts.
        run: df -h /

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake clang libclang-dev mold nasm \
            libasound2-dev libjack-jackd2-dev \
            libfontconfig1-dev libfreetype-dev \
            libxkbcommon-dev libwayland-dev libxcb1-dev \
            libgl1-mesa-dev libegl1-mesa-dev \
            libdbus-1-dev libssl-dev \
            libharfbuzz-dev libjbig2dec0-dev libopenjp2-7-dev \
            libjpeg-dev zlib1g-dev libgumbo-dev

      - name: Rust toolchain (pinned, matches the release/build-slint jobs)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-06-23

      - name: Cargo cache (Swatinem/rust-cache)
        # Separate shared-key from slint-linux (that one's target/release tree
        # would otherwise get diluted by this job's target/debug artifacts,
        # and vice versa — different profiles, different fingerprints).
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates -> target
          shared-key: slint-linux-debug
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Note on the previous "isolate qbz-offline-cache alone" attempt: it
      # built fine in 1m13s, but the FULL qbz build then recompiled every
      # single upstream crate from scratch anyway (i-slint-common, slint,
      # etc. — all cache-cold) — proof that `-p qbz-offline-cache` alone
      # unifies a DIFFERENT (smaller) Cargo feature set across shared deps
      # than the full `-p qbz` graph does, so that test never actually
      # reproduced the real build. Dropped.
      #
      # Also dropped: a separate background-monitor step writing to a log
      # file for a LATER step to upload. 4 runs in a row killed the WHOLE
      # RUNNER (every if:always() step skipped) right at qbz-offline-cache —
      # severe enough that no later step ever got to run, so that file never
      # made it out. Fix: print free/df DIRECTLY into this step's own
      # stdout, interleaved with cargo's own "Compiling" lines — that stream
      # is what GitHub Actions shows live in the log (confirmed: every past
      # run's log ends with the last real "Compiling" line before death),
      # so whatever the monitor last printed survives even if everything
      # dies immediately after.
      - name: Build qbz (debug, fast) — with inline memory/disk monitor
        env:
          CARGO_BUILD_JOBS: '1'
          RUSTFLAGS: '-C link-arg=-fuse-ld=mold -C debuginfo=0 -Z threads=4'
        run: |
          cargo build --manifest-path crates/Cargo.toml -p qbz &
          build_pid=$!
          while kill -0 "$build_pid" 2>/dev/null; do
            echo "=== MONITOR $(date -u +%H:%M:%S) ==="
            free -h
            df -h /
            ps -eo pid,ppid,rss,comm --sort=-rss | head -6
            sleep 3
          done
          wait "$build_pid"
          ls -lh crates/target/debug/qbz

      - name: dmesg OOM check
        if: always()
        run: |
          sudo dmesg -T 2>/dev/null | grep -iE "oom|killed process" | tail -20 || echo "no dmesg access / no OOM lines"

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: qbz-linux-x86_64-debug
          path: crates/target/debug/qbz
          if-no-files-found: error

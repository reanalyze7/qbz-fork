name: Build Debug (linux)

# Fast iteration build: DEBUG profile (opt-level 0, no LLVM optimization
# passes), same intent as scripts/slint-dev-fast.sh but run on CI so anyone
# can grab a binary without a local build. Skips the release build's ~30 GB
# qbz_ui memory wall and multi-hour compile entirely — debug compiles in
# minutes since it never runs LLVM's optimizer. NOT for perf testing (see
# release-linux.yml / build-slint.yml for that); this is purely "does it run,
# does it look right".

on:
  workflow_dispatch:

concurrency:
  group: build-debug-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: Disk space check
        # REMOVED the 8 GB /swap_extra file this workflow used to add here:
        # run #4 proved memory isn't the constraint (13/15 GB free, 0 swap
        # used at cutoff), so that swap file was pure unforced downside —
        # and disk is the new suspect for why the runner keeps dying
        # WHOLESALE (every later if:always() step skipped, not just the
        # build step failing) right as qbz-offline-cache starts.
        run: df -h /

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake clang libclang-dev mold nasm \
            libasound2-dev libjack-jackd2-dev \
            libfontconfig1-dev libfreetype-dev \
            libxkbcommon-dev libwayland-dev libxcb1-dev \
            libgl1-mesa-dev libegl1-mesa-dev \
            libdbus-1-dev libssl-dev \
            libharfbuzz-dev libjbig2dec0-dev libopenjp2-7-dev \
            libjpeg-dev zlib1g-dev libgumbo-dev

      - name: Rust toolchain (pinned, matches the release/build-slint jobs)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-06-23

      - name: Cargo cache (Swatinem/rust-cache)
        # Separate shared-key from slint-linux (that one's target/release tree
        # would otherwise get diluted by this job's target/debug artifacts,
        # and vice versa — different profiles, different fingerprints).
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates -> target
          shared-key: slint-linux-debug
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Start memory monitor
        # 1s poll (was 5s) — 3 runs in a row now have the WHOLE RUNNER die
        # (every later if:always() step skipped) right as qbz-offline-cache
        # starts, fast enough that a 5s-resolution log never caught a
        # ballooning value, only healthy readings right before. Also now
        # logs df -h: memory is ruled out (run #4: 13/15 GB free, 0 swap,
        # but that run never reached this crate) — disk is next suspect,
        # and the 8 GB /swap_extra file this workflow used to fallocate on
        # the root disk is REMOVED now (pure unforced downside once memory
        # was cleared).
        run: |
          ( while true; do
              echo "--- $(date -u +%H:%M:%S.%N) ---"
              free -h
              df -h /
              ps -eo pid,ppid,rss,comm --sort=-rss | head -6
              sleep 1
            done > mem-monitor.log 2>&1 & echo $! > mem-monitor.pid )

      - name: Build qbz-offline-cache ALONE (isolate the crate)
        # Before attempting the full qbz binary again: build ONLY this one
        # crate first. If the runner dies here too, it's this crate/its deps
        # (rusqlite bundled -> a C compile of amalgamated sqlite3.c is the
        # prime suspect) in complete isolation from qbz_ui or anything after
        # it — much faster to iterate on than the full ~17min run-up.
        env:
          CARGO_BUILD_JOBS: '1'
          RUSTFLAGS: '-C link-arg=-fuse-ld=mold -C debuginfo=0 -Z threads=4'
        run: |
          timeout --signal=TERM 600 cargo build --manifest-path crates/Cargo.toml -p qbz-offline-cache -vv

      - name: Build qbz (debug, fast)
        env:
          CARGO_BUILD_JOBS: '1'
          RUSTFLAGS: '-C link-arg=-fuse-ld=mold -C debuginfo=0 -Z threads=4'
        run: |
          timeout --signal=TERM 900 cargo build --manifest-path crates/Cargo.toml -p qbz
          ls -lh crates/target/debug/qbz

      - name: Stop memory monitor
        if: always()
        run: |
          kill "$(cat mem-monitor.pid)" 2>/dev/null || true
          echo "Last 100 lines:"
          tail -c 20000 mem-monitor.log || true
          echo "--- dmesg OOM check ---"
          sudo dmesg -T 2>/dev/null | grep -iE "oom|killed process" | tail -20 || echo "no dmesg access / no OOM lines"

      - name: Upload memory monitor log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mem-monitor-debug-log
          path: mem-monitor.log
          if-no-files-found: ignore

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: qbz-linux-x86_64-debug
          path: crates/target/debug/qbz
          if-no-files-found: error

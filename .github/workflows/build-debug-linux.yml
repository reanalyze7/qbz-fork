name: Build Debug (linux)

# Fast iteration build: DEBUG profile (opt-level 0, no LLVM optimization
# passes), same intent as scripts/slint-dev-fast.sh but run on CI so anyone
# can grab a binary without a local build. Skips the release build's ~30 GB
# qbz_ui memory wall and multi-hour compile entirely — debug compiles in
# minutes since it never runs LLVM's optimizer. NOT for perf testing (see
# release-linux.yml / build-slint.yml for that); this is purely "does it run,
# does it look right".

on:
  workflow_dispatch:

concurrency:
  group: build-debug-linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Add swap (safety margin)
        # Debug compiles need far less memory than release (no LLVM
        # optimizer), but the first attempt at this workflow OOM-killed
        # (exit 143) using -Z threads=16 with the DEFAULT CARGO_BUILD_JOBS
        # (several rustc processes in parallel, each 16 internal threads —
        # the same combination that OOM'd a local 15 GB machine earlier).
        # Fixed below by capping both; this small swap is just cheap
        # insurance on top of that, not the primary fix.
        run: |
          ( sudo fallocate -l 8G /swap_extra \
            && sudo chmod 600 /swap_extra \
            && sudo mkswap /swap_extra \
            && sudo swapon /swap_extra ) || echo "extra swap skipped (non-fatal)"
          free -h

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config cmake clang libclang-dev mold nasm \
            libasound2-dev libjack-jackd2-dev \
            libfontconfig1-dev libfreetype-dev \
            libxkbcommon-dev libwayland-dev libxcb1-dev \
            libgl1-mesa-dev libegl1-mesa-dev \
            libdbus-1-dev libssl-dev \
            libharfbuzz-dev libjbig2dec0-dev libopenjp2-7-dev \
            libjpeg-dev zlib1g-dev libgumbo-dev

      - name: Rust toolchain (pinned, matches the release/build-slint jobs)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-06-23

      - name: Cargo cache (Swatinem/rust-cache)
        # Separate shared-key from slint-linux (that one's target/release tree
        # would otherwise get diluted by this job's target/debug artifacts,
        # and vice versa — different profiles, different fingerprints).
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates -> target
          shared-key: slint-linux-debug
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Start memory monitor
        # RULED OUT (run #4, 8-min self-timeout): memory is NOT the cause —
        # at the timeout, RSS was ~500 MB for rustc, 13 GB of 15 GB still
        # available, 0 B swap used. That run's timeout fired before reaching
        # qbz-offline-cache though, so it's untested there specifically.
        # Next suspect: DISK. `df -h` added to the loop — bundled libsqlite3
        # (C compile) + full debug symbols across ~30 crates could be
        # filling the runner's disk right around that crate.
        run: |
          ( while true; do
              echo "--- $(date -u +%H:%M:%S) ---"
              free -h
              df -h / /mnt 2>/dev/null
              ps -eo pid,ppid,rss,comm --sort=-rss | head -8
              sleep 5
            done > mem-monitor.log 2>&1 & echo $! > mem-monitor.pid )

      - name: Build qbz (debug, fast)
        # Self-terminating (see note above the monitor step for why): bumped
        # to 20 min this time so it actually reaches qbz-offline-cache
        # (8 min cut off during qbz-player, before ever getting there).
        env:
          CARGO_BUILD_JOBS: '1'
          RUSTFLAGS: '-C link-arg=-fuse-ld=mold -C debuginfo=0 -Z threads=4'
        run: |
          timeout --signal=TERM 1200 cargo build --manifest-path crates/Cargo.toml -p qbz
          ls -lh crates/target/debug/qbz

      - name: Stop memory monitor
        if: always()
        run: |
          kill "$(cat mem-monitor.pid)" 2>/dev/null || true
          echo "Last 100 lines:"
          tail -c 20000 mem-monitor.log || true
          echo "--- dmesg OOM check ---"
          sudo dmesg -T 2>/dev/null | grep -iE "oom|killed process" | tail -20 || echo "no dmesg access / no OOM lines"

      - name: Upload memory monitor log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mem-monitor-debug-log
          path: mem-monitor.log
          if-no-files-found: ignore

      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: qbz-linux-x86_64-debug
          path: crates/target/debug/qbz
          if-no-files-found: error

# Channel releases: pushing a branch publishes a ready-to-install .deb.
#
#   branch  channel  build profile   GitHub Release (rolling tag)   latest?
#   ------  -------  --------------  ----------------------------  -------
#   prod    prod     release          channel-prod                  yes
#   int     int      release          channel-int                   no (pre)
#   main    main     dev (optimised)  channel-main                  no (pre)
#
# The tag per channel is REWRITTEN on every push, so the download URL of the
# .deb never changes — that is the point: an install script or an APT job can
# hardcode .../releases/download/channel-prod/QBZ_prod_amd64.deb forever.
# Version-tagged releases (v*) are a different pipeline entirely and stay in
# release-linux.yml, which also ships rpm/AppImage/tarballs; this workflow
# deliberately produces ONLY the deb, to keep a per-push build affordable.
#
# `main` builds with [profile.dev] (our crates opt-level 1, deps 3) — usable
# frame rate, ~1 h instead of several. prod/int get the real release recipe.

name: release-channel

on:
  push:
    branches: [main, int, prod]
  workflow_dispatch:

concurrency:
  # Per branch: a newer push supersedes an in-flight build of the same
  # channel (the tag would be overwritten anyway), but prod and int never
  # cancel each other.
  group: release-channel-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  meta:
    runs-on: ubuntu-24.04
    outputs:
      channel: ${{ steps.m.outputs.channel }}
      profile: ${{ steps.m.outputs.profile }}
      prerelease: ${{ steps.m.outputs.prerelease }}
      version: ${{ steps.m.outputs.version }}
      tag: ${{ steps.m.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - id: m
        name: Resolve channel, profile and package version
        run: .github/scripts/channel-meta.sh "${{ github.ref_name }}"

  build-qbz:
    needs: meta
    runs-on: ubuntu-24.04
    # The release recipe is hours-class; the dev one is roughly a third of
    # that. Both are far above the default 360 min cap only in the worst case.
    timeout-minutes: ${{ needs.meta.outputs.profile == 'release' && 300 || 130 }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/qbz-linux-runner-prep
        with:
          # Own key per profile — a target/debug tree and a target/release tree
          # have different fingerprints and would dilute each other.
          #
          # And SAVE it. This used to restore `slint-linux` and save nothing,
          # but that key is written by nobody: release-linux.yml is the only
          # writer and it runs on `v*` tags with `save-if: ref == main`, which
          # a tag ref never satisfies. So every channel build recompiled the
          # entire dependency graph from scratch. The first build after this
          # change still pays full price; the ones after it skip the deps.
          cache-shared-key: channel-${{ needs.meta.outputs.profile }}
          save-cache: "true"

      # Two phases, because only ONE crate needs the ceremony.
      #
      # The ~30 GB peak is qbz_ui's single rustc. CARGO_BUILD_JOBS=1 exists to
      # stop anything running beside it — but it was applied to the whole
      # build, serialising every sibling crate and every third-party
      # dependency for a constraint none of them impose.
      #
      # Phase 1 builds the workspace WITHOUT qbz-ui and qbz, in parallel: those
      # are ordinary crates, a few hundred MB each, and 4 of them fit the
      # runner's 16 GB + 18 GB swap comfortably. Phase 2 then has only the
      # heavy pair left and takes them one at a time, exactly as before.
      #
      # qbzd is excluded too: the build-qbzd job below already compiles it, on
      # a different runner image for its glibc floor. Its dependencies still
      # get built here, through the sibling crates that share them.
      - name: Build qbz (release)
        if: needs.meta.outputs.profile == 'release'
        env:
          CARGO_INCREMENTAL: "0"
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "256"
          CARGO_PROFILE_RELEASE_OPT_LEVEL: "2"
          RUSTFLAGS: "-C link-arg=-fuse-ld=mold -Z threads=1"
        run: |
          cargo build --release --manifest-path crates/Cargo.toml \
            --workspace --exclude qbz --exclude qbz-ui --exclude qbzd --jobs 4
          cargo build --release --manifest-path crates/Cargo.toml \
            -p qbz --jobs 1
          strip -o qbz crates/target/release/qbz

      # debuginfo=0: the artifact is for running the app, not for debugging
      # it, and the symbols would triple the .deb.
      - name: Build qbz (dev, optimised)
        if: needs.meta.outputs.profile != 'release'
        env:
          RUSTFLAGS: "-C link-arg=-fuse-ld=mold -C debuginfo=0"
        run: |
          cargo build --manifest-path crates/Cargo.toml \
            --workspace --exclude qbz --exclude qbz-ui --exclude qbzd --jobs 4
          cargo build --manifest-path crates/Cargo.toml -p qbz --jobs 1
          strip -o qbz crates/target/debug/qbz

      - uses: actions/upload-artifact@v7
        with: { name: channel-qbz, path: qbz, if-no-files-found: error }

  # qbzd is Slint-free, so it is minutes-class and always built in release —
  # none of the desktop build's ceremony applies. nfpm needs it: the deb
  # ships both binaries.
  build-qbzd:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: System deps
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libjack-jackd2-dev libdbus-1-dev libssl-dev
      - name: Build qbzd
        run: cargo build --release --manifest-path crates/Cargo.toml -p qbzd
      - uses: actions/upload-artifact@v7
        with: { name: channel-qbzd, path: crates/target/release/qbzd, if-no-files-found: error }

  publish:
    needs: [meta, build-qbz, build-qbzd]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with: { name: channel-qbz }
      - uses: actions/download-artifact@v8
        with: { name: channel-qbzd }
      - uses: ./.github/actions/qbz-channel-publish
        with:
          channel: ${{ needs.meta.outputs.channel }}
          version: ${{ needs.meta.outputs.version }}
          tag: ${{ needs.meta.outputs.tag }}
          prerelease: ${{ needs.meta.outputs.prerelease }}
          token: ${{ secrets.GITHUB_TOKEN }}

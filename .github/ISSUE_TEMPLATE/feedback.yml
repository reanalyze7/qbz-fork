name: Feedback
description: General feedback, UX thoughts, or non-bug discussion
title: "[Feedback] "
labels: ["feedback"]
body:
  - type: textarea
    id: feedback
    attributes:
      label: Feedback
      description: Share your thoughts, impressions, or experience using Qoqobuz.
    validations:
      required: true

  - type: textarea
    id: works-well
    attributes:
      label: What works well?

  - type: textarea
    id: improvements
    attributes:
      label: What could be improved?

  - type: input
    id: version
    attributes:
      label: Qoqobuz version (optional)
      placeholder: e.g. v1.2.0

  - type: dropdown
    id: install
    attributes:
      label: Installation method (optional)
      options:
        - ""
        - Channel .deb — prod
        - Channel .deb — int
        - Built from source

  - type: input
    id: distro
    attributes:
      label: Distribution (optional)
      placeholder: e.g. Debian 13 (trixie), Ubuntu 24.04

  - type: textarea
    id: notes
    attributes:
      label: Additional notes
      description: Anything else you'd like to share.

# Package the channel build as a .deb and publish it on the channel's
# rolling GitHub Release.
#
# WHY a rolling tag rather than one tag per push: the reason the channels
# exist is that something downstream (an install one-liner, a provisioning
# script, an APT job) can point at ONE URL and always get the current build
# of that channel. A new tag per push would move the URL every time and bury
# the release list. The trade-off — no history of superseded channel builds
# — is deliberate: the commit is still in git, and real history lives on the
# version-tagged releases produced by release-linux.yml.

name: Publish a qbz channel .deb
description: Build the .deb with nfpm and (re)publish the channel's rolling GitHub Release.

inputs:
  channel:
    description: prod | int | main
    required: true
  version:
    description: Debian package version minted by channel-meta.sh.
    required: true
  tag:
    description: Rolling tag for this channel (channel-<channel>).
    required: true
  prerelease:
    description: "true for int/main, false for prod."
    required: true
  token:
    description: Token with contents:write, for gh.
    required: true

runs:
  using: composite
  steps:
    - name: Install nfpm
      shell: bash
      run: |
        echo 'deb [trusted=yes] https://repo.goreleaser.com/apt/ /' | \
          sudo tee /etc/apt/sources.list.d/goreleaser.list
        sudo apt-get update
        sudo apt-get install -y nfpm
        nfpm --version

    # nfpm does NOT expand env vars in contents[].src, so the binaries must
    # sit at the literal ./qbz and ./qbzd paths the config names. The
    # download-artifact steps in the caller put them there.
    - name: Build the .deb
      shell: bash
      env:
        QBZ_VERSION: ${{ inputs.version }}
        QBZ_ARCH: amd64
        QBZ_BINARY: ./qbz
      run: |
        set -euo pipefail
        chmod +x qbz qbzd
        mkdir -p dist
        nfpm package -f packaging/nfpm/nfpm.yaml -p deb \
          -t "dist/QBZ_${{ inputs.channel }}_amd64.deb"
        ls -la dist
        dpkg-deb -I "dist/QBZ_${{ inputs.channel }}_amd64.deb"

    # Move the tag first, then recreate the release on it. Deleting the
    # release WITHOUT --cleanup-tag keeps the ref alive between the two
    # steps, so a failure here never leaves the channel with no tag at all.
    - name: Publish the rolling release
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        TAG: ${{ inputs.tag }}
        CHANNEL: ${{ inputs.channel }}
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        git tag -f "$TAG" "$GITHUB_SHA"
        git push -f origin "refs/tags/$TAG"
        gh release delete "$TAG" --yes 2>/dev/null || true
        NOTES=$(printf '%s\n' \
          "Automatic build of the \`$CHANNEL\` channel." \
          "" \
          "| | |" \
          "|---|---|" \
          "| Package version | \`$VERSION\` |" \
          "| Commit | \`$GITHUB_SHA\` |" \
          "| Workflow run | $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID |" \
          "" \
          "Install / upgrade:" \
          "" \
          '```' \
          "sudo apt install -y $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$TAG/QBZ_${CHANNEL}_amd64.deb" \
          '```' \
          "" \
          "This tag is rewritten on every push to \`$CHANNEL\`, so the URL above always serves the current build.")
        ARGS=(--title "QBZ $CHANNEL — $VERSION" --notes "$NOTES" --target "$GITHUB_SHA")
        if [ "${{ inputs.prerelease }}" = "true" ]; then
          ARGS+=(--prerelease --latest=false)
        else
          ARGS+=(--latest)
        fi
        gh release create "$TAG" dist/*.deb "${ARGS[@]}"
